name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancels outdated runs if you push new code quickly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # matrix strategy to test multiple browsers concurrently
    strategy:
      fail-fast: false # Prevents GitHub from cancelling all jobs if just one browser fails
      matrix:
        browser: [chromium, firefox] 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches your Python dependencies

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache the Playwright browser binaries
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      # Only install browsers if the cache was missed
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps ${{ matrix.browser }}

      # Run tests in parallel (-n auto) and capture traces on failure
      - name: Run Playwright Tests
        run: >
          pytest -n auto 
          --browser=${{ matrix.browser }} 
          --tracing=retain-on-failure 
          --html=reports/report-${{ matrix.browser }}.html 
          ./tests/

      - name: Upload Test Report & Traces
        uses: actions/upload-artifact@v4  
        if: always() 
        with:
          name: Playwright-Report-${{ matrix.browser }}
          path: |
            reports/
            test-results/